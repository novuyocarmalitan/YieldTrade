# Render Blueprint: creates the API, the website and the database from this one file.
# If a name below is already taken on Render, change all three names consistently
# (and the two URLs in the env vars) before deploying.

databases:
  - name: yieldtrade-vuyo-db
    plan: free
    region: frankfurt
    databaseName: yieldtrade
    user: yieldtrade

services:
  - type: web
    name: yieldtrade-vuyo-api
    runtime: python
    region: frankfurt
    plan: free
    rootDir: backend
    buildCommand: >-
      pip install -r requirements-prod.txt
      && python manage.py collectstatic --no-input
      && python manage.py migrate
      && python manage.py load_crops
      && if [ "$SEED_DEMO" = "1" ]; then python manage.py seed_demo; fi
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: yieldtrade-vuyo-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: https://yieldtrade-vuyo-web.onrender.com
      - key: SEED_DEMO
        value: "1"

  - type: web
    name: yieldtrade-vuyo-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_BASE
        value: https://yieldtrade-vuyo-api.onrender.com/api
